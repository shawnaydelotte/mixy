# Project-scoped MCP. User ~/.grok/config.toml may still point xcrun at
# Command Line Tools; this path works even when xcode-select is CLT.
[mcp_servers.xcode]
command = "/Applications/Xcode-beta.app/Contents/Developer/usr/bin/mcpbridge"
args = []
enabled = true
startup_timeout_sec = 30
env = { DEVELOPER_DIR = "/Applications/Xcode-beta.app/Contents/Developer" }
